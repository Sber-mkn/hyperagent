services:
  db:
    image: postgres:15-alpine
    container_name: hyperagent_postgres
    restart: always
    environment:
      POSTGRES_DB: hyperagent_db
      POSTGRES_USER: supervisor
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-database:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U supervisor -d hyperagent_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  agent:
    build:
      context: .
      dockerfile: agent_immutable/Dockerfile
    container_name: hyperagent_agent
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - V3_DATA_DIR=/hyperagent/logs/agent_data
      - AGENT_WORKDIR=/hyperagent/workdir
      - AGENT_ROOT=/hyperagent/agent
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent:/hyperagent/agent:rw
      - ./workdir:/hyperagent/workdir:rw
      - ./logs:/hyperagent/logs:rw
      - ./rabbitmq:/hyperagent/rabbitmq:ro
      - ./constitution:/hyperagent/constitution:ro
      - ./agent_immutable:/hyperagent/agent_immutable:ro
      - ./database/agent:/hyperagent/database/agent:ro
    restart: always
  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    container_name: hyperagent_supervisor
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=hyperagent_db
      - POSTGRES_USER=supervisor
      - POSTGRES_PASSWORD=12345
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agent:/hyperagent/agent
      - ./agent_git:/hyperagent/agent_git
      - ./supervisor:/hyperagent/supervisor
      - ./database:/hyperagent/database
      - ./rabbitmq:/hyperagent/rabbitmq
      - ./requirements:/hyperagent/requirements
      - ./contracts:/hyperagent/contracts
      - /var/run/docker.sock:/var/run/docker.sock
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: hyperagent_client
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    volumes:
      - ./client:/hyperagent/client
      - ./rabbitmq:/hyperagent/rabbitmq
      - ./agent/tools:/hyperagent/agent/tools:ro
      - ./workdir:/hyperagent/client/workdir:rw
    stdin_open: true
    tty: true
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hyperagent_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
  rabbitmq_data:
